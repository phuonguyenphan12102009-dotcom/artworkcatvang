<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bức tranh chỉ rõ khi có người cùng nhìn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3eb;
    --ink: #3a3128;
    --muted: #8a7d6d;
    --accent: #b5835a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    /* Lora hỗ trợ đầy đủ tiếng Việt; các font phía sau là dự phòng cũng có dấu tiếng Việt */
    font-family: "Lora", "Noto Serif", "Times New Roman", serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 12px;
  }
  h1 { font-weight: 500; font-size: clamp(1.4rem, 3.6vw, 2rem); line-height: 1.3; margin: 0 0 8px; }
  .sub { color: var(--muted); font-style: italic; margin: 0 0 16px; max-width: 800px; }
  .frame {
    padding: 12px;
    background: #fffdf8;
    box-shadow: 0 10px 40px rgba(80, 60, 30, .15);
    border-radius: 4px;
    max-width: 96vw;
  }
  .frame-inner { overflow: hidden; border-radius: 2px; line-height: 0; }
  /* Ảnh to hơn: tối đa 1000px ngang, nhưng không cao quá màn hình để còn thấy thanh tiến trình */
  #art {
    display: block;
    width: auto;
    height: auto;
    max-width: min(calc(96vw - 24px), 1000px);
    max-height: calc(100vh - 280px);
    min-height: 220px;
    object-fit: contain;
    transition: filter 0.9s ease;
    filter: blur(24px) grayscale(1);
  }
  .stats { margin-top: 20px; width: min(92vw, 560px); }
  .percent { font-size: 1.9rem; line-height: 1.2; color: var(--accent); }
  .bar {
    width: 100%;
    height: 14px;
    background: #e6dfd1;
    border-radius: 999px;
    margin: 8px auto 0;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(80, 60, 30, .15);
  }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .9s ease; }
  button {
    margin-top: 22px;
    font: inherit;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--accent);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button:hover { background: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Bức tranh chỉ hiện rõ khi nhiều người cùng nhìn</h1>
  <p class="sub">Mỗi người ghé xem sẽ làm bức tranh rõ nét và nhiều màu sắc hơn, không cần phải xem cùng lúc.</p>

  <div class="frame">
    <div class="frame-inner">
      <img id="art" src="artwork.jpg" alt="Tác phẩm nghệ thuật">
    </div>
  </div>

  <div class="stats">
    <div class="percent"><span id="pct">0</span>%</div>
    <div class="bar" id="barWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Mức độ rõ nét của bức tranh">
      <i id="bar"></i>
    </div>
  </div>

  <!-- Nút reset chỉ hiện khi mở trang với ?admin=<khoá> -->
  <button id="resetBtn" hidden>Ẩn mờ lại (Reset)</button>

<script>
  // Tổng số người (mỗi thiết bị tính 1 lần, cộng dồn theo thời gian) để tranh rõ nét 100%
  const TARGET_VIEWERS = 10;
  const MAX_BLUR_PX = 24;
  const POLL_MS = 5000;

  const art = document.getElementById('art');
  const pct = document.getElementById('pct');
  const bar = document.getElementById('bar');
  const barWrap = document.getElementById('barWrap');
  const resetBtn = document.getElementById('resetBtn');

  // Mã ẩn danh của thiết bị, lưu trong trình duyệt để tải lại trang không bị tính thêm lần nữa
  function getVisitorId() {
    const make = () => (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    try {
      let id = localStorage.getItem('la_visitor_id');
      if (!id) { id = make(); localStorage.setItem('la_visitor_id', id); }
      return id;
    } catch (e) {
      return make();
    }
  }

  // Chỉ hiện nút reset với đường dẫn dạng /?admin=<khoá>
  const adminKey = new URLSearchParams(location.search).get('admin');
  if (adminKey !== null) resetBtn.hidden = false;

  function render(count) {
    const p = Math.min(count / TARGET_VIEWERS, 1);
    art.style.filter =
      `blur(${(MAX_BLUR_PX * (1 - p)).toFixed(1)}px) grayscale(${(1 - p).toFixed(2)})`;
    const percent = Math.round(p * 100);
    pct.textContent = percent;
    bar.style.width = percent + '%';
    barWrap.setAttribute('aria-valuenow', percent);
  }

  async function visit() {
    try {
      const r = await fetch('/visit', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: getVisitorId() })
      });
      const d = await r.json();
      if (d.ok) render(d.count);
    } catch (e) { /* thử lại khi tải lại trang; poll vẫn cập nhật số đếm */ }
  }

  async function poll() {
    if (document.hidden) return;
    try {
      const r = await fetch('/count', { cache: 'no-store' });
      const d = await r.json();
      if (typeof d.count === 'number') render(d.count);
    } catch (e) {}
  }

  resetBtn.addEventListener('click', async () => {
    try {
      const r = await fetch('/reset', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'x-admin-key': adminKey || '' }
      });
      const d = await r.json();
      if (d.ok) render(d.count);
      else alert('Reset không thành công (sai khoá admin?).');
    } catch (e) {}
  });

  visit().then(() => setInterval(poll, POLL_MS));
</script>
</body>
</html>
