<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bức tranh chỉ rõ khi có người cùng nhìn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3eb;
    --ink: #3a3128;
    --muted: #8a7d6d;
    --accent: #b5835a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    /* Lora hỗ trợ đầy đủ tiếng Việt; các font phía sau là dự phòng cũng có dấu tiếng Việt */
    font-family: "Lora", "Noto Serif", "Times New Roman", serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 12px;
  }
  h1 { font-weight: 500; font-size: clamp(1.4rem, 3.6vw, 2rem); line-height: 1.3; margin: 0 0 8px; }
  .sub { color: var(--muted); font-style: italic; margin: 0 0 16px; max-width: 800px; }
  .frame {
    padding: 12px;
    background: #fffdf8;
    box-shadow: 0 10px 40px rgba(80, 60, 30, .15);
    border-radius: 4px;
    max-width: 96vw;
  }
  .frame-inner { overflow: hidden; border-radius: 2px; line-height: 0; }
  /* Ảnh to hơn: tối đa 1000px ngang, nhưng không cao quá màn hình để còn thấy thanh tiến trình */
  #art {
    display: block;
    width: auto;
    height: auto;
    max-width: min(calc(96vw - 24px), 1000px);
    max-height: calc(100vh - 310px);
    min-height: 220px;
    object-fit: contain;
    transition: filter 0.9s ease;
    filter: blur(24px) grayscale(1);
  }
  .stats { margin-top: 20px; width: min(92vw, 560px); }
  .percent { font-size: 1.9rem; line-height: 1.2; color: var(--accent); }
  .bar {
    width: 100%;
    height: 14px;
    background: #e6dfd1;
    border-radius: 999px;
    margin: 8px auto 0;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(80, 60, 30, .15);
  }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .9s ease; }
  button {
    margin-top: 22px;
    font: inherit;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--accent);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button:hover { background: var(--accent); color: #fff; }

  .note { color: var(--muted); font-size: .85rem; margin: 12px 0 0; min-height: 1.4em; }
  .cam {
    position: fixed; right: 14px; bottom: 14px; width: 168px;
    background: #fffdf8; padding: 5px; border-radius: 6px;
    box-shadow: 0 6px 24px rgba(80, 60, 30, .25);
    line-height: 0;
  }
  .cam-view { position: relative; width: 100%; aspect-ratio: 4 / 3; transform: scaleX(-1); border-radius: 3px; overflow: hidden; background: #222; }
  .cam-view video, .cam-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cam-view video { object-fit: fill; }
  .badge {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(58, 49, 40, .78); color: #fff;
    font-size: .75rem; line-height: 1; padding: 5px 8px; border-radius: 999px;
  }
  @media (max-width: 520px) { .cam { width: 108px; right: 8px; bottom: 8px; } }
  #dbg {
    position: fixed; left: 10px; top: 10px; margin: 0; text-align: left;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; line-height: 1.4;
    background: rgba(58, 49, 40, .85); color: #d9f99d; padding: 8px 10px; border-radius: 6px;
    white-space: pre; z-index: 5;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Bức tranh chỉ hiện rõ khi nhiều người cùng nhìn</h1>
  <p class="sub">Mỗi người đến nhìn vào màn hình sẽ làm bức tranh rõ nét và nhiều màu sắc hơn, không cần nhìn cùng lúc.</p>

  <div class="frame">
    <div class="frame-inner">
      <img id="art" src="artwork.jpg" alt="Tác phẩm nghệ thuật">
    </div>
  </div>

  <div class="stats">
    <div class="percent"><span id="pct">0</span>%</div>
    <div class="bar" id="barWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Mức độ rõ nét của bức tranh">
      <i id="bar"></i>
    </div>
  </div>

  <p class="note" id="msg">Đang bật camera…</p>
  <button id="camBtn" hidden>Bật camera</button>
  <!-- Nút reset chỉ hiện khi mở trang với ?admin -->
  <button id="resetBtn" hidden>Ẩn mờ lại (Reset)</button>

  <!-- Bảng số liệu để chỉnh độ nhạy: mở trang với ?debug -->
  <pre id="dbg" hidden></pre>

  <!-- Khung nhỏ cho thấy camera đang nhận diện (ô xanh = đang nhìn vào màn hình) -->
  <div class="cam" id="cam" hidden>
    <div class="cam-view" id="camView">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <span class="badge" id="badge">0 người</span>
  </div>

<script src="vendor/face-api.js"></script>
<script>
  // ===== Cấu hình =====
  const TARGET_VIEWERS = 10;      // số người để tranh rõ nét 100%
  const MODE = 'accumulate';      // 'accumulate': cộng dồn mỗi lượt có người đến nhìn (không cần cùng lúc)
                                  // 'live'      : chỉ tính số người đang nhìn tại thời điểm hiện tại
  const MAX_BLUR_PX = 24;
  const DETECT_INTERVAL_MS = 80;  // nghỉ giữa hai lần nhận diện (thời gian chạy model đã tự làm chậm vòng lặp trên máy yếu)

  // --- Camera ---
  const CAM_WIDTH = 1280, CAM_HEIGHT = 720; // độ phân giải yêu cầu; cao hơn giúp nhận ra người đứng xa (máy yếu có thể hạ về 640x480)

  // --- Bộ nhận diện khuôn mặt ---
  const PREFER_SSD = true;        // true: dùng SsdMobilenetv1 (chính xác hơn) nếu có file model trong public/vendor/models, không có thì tự dùng TinyFaceDetector
  const SSD_MIN_CONF = 0.5;       // SSD: độ tin cậy tối thiểu
  const INPUT_SIZE = 320;         // Tiny: cỡ ảnh đưa vào (128/160/192/224/320/416); lớn hơn nhận được người xa hơn nhưng chậm hơn
  const MIN_SCORE = 0.35;         // Tiny: độ tin cậy tối thiểu; hạ xuống nếu bỏ sót người, nâng lên nếu nhận nhầm

  // --- Lọc nhiễu theo thời gian ---
  const ARRIVE_MS = 1200;         // phải thấy người trong phần lớn khoảng này mới tính là có người đến nhìn
  const LEAVE_MS = 3000;          // mất dấu liên tục ngần này mới tính là người đã rời đi (chịu được lúc nhận diện chập chờn)
  const MIN_FACE_RATIO = 0.04;    // mặt nhỏ hơn 4% bề ngang khung hình (người đứng quá xa) thì bỏ qua

  // --- Hướng nhìn (chỉ tính người đang quay mặt về phía màn hình) ---
  const CHECK_GAZE = true;
  const YAW_MAX_OFFSET = 0.22;    // lệch trái/phải: 0 = nhìn thẳng; 0.22 ≈ quay đầu ~30°. Nới ra (0.28) nếu hay bỏ sót, siết lại (0.16) nếu tính nhầm người nhìn đi chỗ khác
  const PITCH_MIN = 0.22, PITCH_MAX = 0.65; // ngẩng/cúi: vị trí mũi trên đoạn từ đường hai mắt xuống cằm (nhìn thẳng thường ≈ 0.35–0.45). Mở trang bằng ?debug để xem số thực tế rồi chỉnh
  const ROLL_MAX_DEG = 30;        // nghiêng đầu quá góc này thì không tính
  const STORE_KEY = 'la_total';

  const $ = id => document.getElementById(id);
  const art = $('art'), pct = $('pct'), bar = $('bar'), barWrap = $('barWrap');
  const msgEl = $('msg'), camBtn = $('camBtn'), resetBtn = $('resetBtn');
  const cam = $('cam'), camView = $('camView'), video = $('video'), overlay = $('overlay'), badge = $('badge');

  if (MODE === 'live') {
    document.querySelector('.sub').textContent = 'Càng đông người cùng nhìn vào màn hình, tranh càng rõ nét và nhiều màu sắc.';
  }
  const params = new URLSearchParams(location.search);
  if (params.has('admin')) resetBtn.hidden = false;
  const DEBUG = params.has('debug');
  const dbg = $('dbg');
  if (DEBUG) dbg.hidden = false;

  // ===== Hiển thị =====
  function render(count) {
    const p = Math.min(count / TARGET_VIEWERS, 1);
    art.style.filter = `blur(${(MAX_BLUR_PX * (1 - p)).toFixed(1)}px) grayscale(${(1 - p).toFixed(2)})`;
    const percent = Math.round(p * 100);
    pct.textContent = percent;
    bar.style.width = percent + '%';
    barWrap.setAttribute('aria-valuenow', percent);
  }
  const msg = t => { msgEl.textContent = t; };

  // ===== Đếm =====
  let total = 0;            // tổng lượt người đã đến nhìn (chế độ accumulate)
  let stable = 0;           // số người đang nhìn, đã lọc nhiễu
  let samples = [];         // các lần nhận diện gần đây: { t, n }

  try { total = Number(localStorage.getItem(STORE_KEY)) || 0; } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, String(total)); } catch (e) {} };
  const refresh = () => render(MODE === 'accumulate' ? total : stable);
  refresh();

  function setStable(n) {
    if (n === stable) return;
    if (MODE === 'accumulate' && n > stable) { total += n - stable; save(); }  // có thêm người đến nhìn
    stable = n;
    badge.textContent = stable + ' người';
    refresh();
  }

  function onCount(n, now) {
    samples.push({ t: now, n });
    while (samples.length && now - samples[0].t > LEAVE_MS) samples.shift();

    // Tăng: số người k xuất hiện ở >= 60% các lần nhận diện trong ARRIVE_MS gần nhất
    const recent = samples.filter(s => now - s.t <= ARRIVE_MS);
    if (recent.length >= 2) {
      let up = 0;
      for (let k = stable + 1; k <= 20; k++) {
        if (recent.filter(s => s.n >= k).length >= 0.6 * recent.length) up = k; else break;
      }
      if (up > stable) { setStable(up); return; }
    }
    // Giảm: trong LEAVE_MS gần nhất không còn lần nào thấy đủ `stable` người
    if (samples.length && now - samples[0].t >= LEAVE_MS - 400) {
      const maxRecent = Math.max(...samples.map(s => s.n));
      if (maxRecent < stable) setStable(maxRecent);
    }
  }

  resetBtn.addEventListener('click', () => { total = 0; save(); refresh(); });

  // ===== Nhận diện mặt =====
  const avg = (pts, idx, k) => idx.reduce((sum, i) => sum + pts[i][k], 0) / idx.length;
  const LEFT_EYE = [36, 37, 38, 39, 40, 41], RIGHT_EYE = [42, 43, 44, 45, 46, 47];

  // Ước lượng hướng mặt từ 68 điểm landmark. Trả về { yaw, pitch, roll } (yaw: 0 = thẳng; pitch: tỉ lệ; roll: độ)
  function headPose(pts) {
    const nose = pts[30];
    // Trái/phải: so mũi với giữa hai khóe mắt ngoài, và với hai bên hàm; lấy trung bình cho đỡ nhiễu
    const eyeL = pts[36], eyeR = pts[45];
    const eyeW = eyeR.x - eyeL.x, jawW = pts[16].x - pts[0].x;
    if (eyeW <= 0 || jawW <= 0) return null;
    const yawEye = (nose.x - eyeL.x) / eyeW - 0.5;
    const yawJaw = (nose.x - pts[0].x) / jawW - 0.5;
    const yaw = (yawEye + yawJaw) / 2;
    // Ngẩng/cúi: vị trí mũi trên đoạn từ đường hai mắt xuống cằm
    const eyeY = (avg(pts, LEFT_EYE, 'y') + avg(pts, RIGHT_EYE, 'y')) / 2;
    const chinY = pts[8].y;
    if (chinY - eyeY <= 0) return null;
    const pitch = (nose.y - eyeY) / (chinY - eyeY);
    // Nghiêng đầu: góc đường nối hai mắt so với phương ngang
    const cl = { x: avg(pts, LEFT_EYE, 'x'), y: avg(pts, LEFT_EYE, 'y') };
    const cr = { x: avg(pts, RIGHT_EYE, 'x'), y: avg(pts, RIGHT_EYE, 'y') };
    const roll = Math.atan2(cr.y - cl.y, cr.x - cl.x) * 180 / Math.PI;
    return { yaw, pitch, roll };
  }

  function lookingFrom(box, pts, videoWidth) {
    if (box.width / videoWidth < MIN_FACE_RATIO) return { ok: false };
    if (!CHECK_GAZE) return { ok: true };
    const pose = headPose(pts);
    if (!pose) return { ok: false };
    const ok = Math.abs(pose.yaw) <= YAW_MAX_OFFSET
      && pose.pitch >= PITCH_MIN && pose.pitch <= PITCH_MAX
      && Math.abs(pose.roll) <= ROLL_MAX_DEG;
    return { ok, pose };
  }

  const isLooking = det => lookingFrom(det.detection.box, det.landmarks.positions, video.videoWidth);

  function draw(dets, looking) {
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    ctx.lineWidth = Math.max(2, overlay.width / 160);
    dets.forEach((d, i) => {
      const b = d.detection.box;
      ctx.strokeStyle = looking[i].ok ? '#4ade80' : '#9ca3af';
      ctx.strokeRect(b.x, b.y, b.width, b.height);
    });
  }

  let detectorOptions = null;
  let detectorName = '';
  const fmt = v => (v >= 0 ? ' ' : '') + v.toFixed(2);

  async function detectLoop() {
    try {
      if (video.readyState >= 2 && video.videoWidth && detectorOptions) {
        const dets = await faceapi.detectAllFaces(video, detectorOptions).withFaceLandmarks(true);
        const looking = dets.map(isLooking);
        draw(dets, looking);
        onCount(looking.filter(r => r.ok).length, performance.now());
        if (DEBUG) {
          const lines = ['Bộ nhận diện: ' + detectorName, 'Khuôn mặt: ' + dets.length + '  | đang nhìn: ' + looking.filter(r => r.ok).length];
          looking.forEach((r, i) => {
            lines.push(r.pose
              ? '#' + (i + 1) + ' yaw ' + fmt(r.pose.yaw) + '  pitch ' + r.pose.pitch.toFixed(2) + '  roll ' + fmt(r.pose.roll / 1) + '°  ' + (r.ok ? 'NHÌN' : '—')
              : '#' + (i + 1) + (r.ok ? ' NHÌN' : ' (quá nhỏ/xa)'));
          });
          lines.push('Ngưỡng: |yaw| ≤ ' + YAW_MAX_OFFSET + ', pitch ' + PITCH_MIN + '–' + PITCH_MAX);
          dbg.textContent = lines.join('\n');
        }
      }
    } catch (e) { console.error(e); }
    setTimeout(detectLoop, DETECT_INTERVAL_MS);
  }

  // ===== Camera =====
  let started = false;
  const MODEL_DIR = 'vendor/models';
  const modelsReady = (async () => {
    try { await faceapi.tf.ready(); } catch (e) {}
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_DIR);
    // Ưu tiên SSD (chính xác hơn); nếu chưa có file model thì dùng Tiny như trước
    if (PREFER_SSD) {
      try {
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_DIR);
        detectorOptions = new faceapi.SsdMobilenetv1Options({ minConfidence: SSD_MIN_CONF });
        detectorName = 'SSD MobileNet v1';
      } catch (e) {
        console.info('Chưa có model SSD trong ' + MODEL_DIR + ', dùng TinyFaceDetector.');
      }
    }
    if (!detectorOptions) {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_DIR);
      detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: INPUT_SIZE, scoreThreshold: MIN_SCORE });
      detectorName = 'Tiny Face Detector (' + INPUT_SIZE + ')';
    }
  })();

  async function startCamera() {
    camBtn.hidden = true;
    msg('Đang bật camera…');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('Cần mở trang bằng https hoặc localhost thì trình duyệt mới cho dùng camera.');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: CAM_WIDTH }, height: { ideal: CAM_HEIGHT } }, audio: false
      });
    } catch (e) {
      msg('Chưa bật được camera. Hãy cho phép trang dùng camera rồi bấm "Bật camera".');
      camBtn.hidden = false;
      return;
    }
    try {
      video.srcObject = stream;
      await video.play();
      await modelsReady;
    } catch (e) {
      console.error(e);
      msg('Không tải được bộ nhận diện khuôn mặt. Hãy tải lại trang.');
      return;
    }
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    camView.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
    cam.hidden = false;
    msg('Camera chỉ dùng để đếm người, không ghi hình hay gửi đi đâu.');
    if (!started) { started = true; detectLoop(); }
  }

  camBtn.addEventListener('click', startCamera);
  startCamera();
</script>
</body>
</html>
